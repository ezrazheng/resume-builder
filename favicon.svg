<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style type="text/css">
      @import url("https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;display=swap");
      .mark {
        font-family: "DM Serif Display", Georgia, serif;
        font-size: 20px;
        font-weight: 400;
        fill: #1c1c1e;
        letter-spacing: -0.02em;
      }
      .tile {
        fill: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        .tile { fill: #1c1c1e; }
        .mark { fill: #f5f5f7; }
      }
    </style>
  </defs>
  <rect class="tile" width="32" height="32" rx="7"/>
  <text class="mark" x="16" y="16" text-anchor="middle" dominant-baseline="central">R</text>
</svg>
